<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | O(Pizza)</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="Js/dangnhap.js" defer></script>
</head>
<body>
    <main class="auth-card">
        <a class="back-link" href="trangchu.html">← Trang chủ</a>
        <h1>Chào mừng đến O(Pizza)</h1>
        <p class="intro">Đăng nhập tài khoản khách hàng để đặt bàn.</p>
        <div class="tabs" role="tablist" aria-label="Tài khoản">
            <button type="button" class="tab active" id="login-tab" role="tab" aria-selected="true">Đăng nhập</button>
            <button type="button" class="tab" id="register-tab" role="tab" aria-selected="false">Tạo tài khoản khách</button>
        </div>
        <form id="login-form">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required>
            <label for="login-password">Mật khẩu</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button class="submit-button" type="submit">Đăng nhập</button>
        </form>
        <form id="register-form" hidden>
            <label for="register-name">Họ tên</label>
            <input id="register-name" name="name" autocomplete="name" minlength="2" maxlength="80" required>
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" autocomplete="email" required>
            <label for="register-password">Mật khẩu (ít nhất 8 ký tự)</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="submit-button" type="submit">Tạo tài khoản và tiếp tục</button>
        </form>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <p class="admin-note">Tài khoản quản trị được cấu hình riêng và không thể tạo từ biểu mẫu đăng ký.</p>
    </main>
</body>
</html>
